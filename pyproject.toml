[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powergrid-benchmark-foundation"
version = "0.2.0"
description = "Reference experiment lifecycle and task contracts for energy algorithm research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
verification = ["build==1.6.1", "coverage==7.16.2", "ruff==0.17.0"]

[project.scripts]
powergrid-bench = "powergrid_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
