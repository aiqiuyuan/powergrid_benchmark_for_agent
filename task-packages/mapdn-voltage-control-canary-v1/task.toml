schema_version = "1.3"
artifacts = ["/app/submission/controller.py"]

[optimization]
metric = "mapdn33_canary_quality_v1"
direction = "higher"

[agent]
timeout_sec = 600

[verifier]
environment_mode = "separate"
timeout_sec = 360

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
storage_mb = 8192
workdir = "/app"
network_mode = "public"

[environment.egress]
mode = "deny"
allow = []

[verifier.environment]
build_timeout_sec = 1800
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
