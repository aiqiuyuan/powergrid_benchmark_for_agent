schema_version = "1.3"
artifacts = ["/app/submission/controller.py"]

[optimization]
metric = "powergym_canary_quality"
direction = "higher"

[agent]
timeout_sec = 600

[environment]
build_timeout_sec = 1800
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/app"
network_mode = "public"

[environment.egress]
mode = "deny"
allow = []

[verifier]
environment_mode = "separate"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800
network_mode = "no-network"
cpus = 1
memory_mb = 2048
storage_mb = 4096
