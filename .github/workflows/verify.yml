name: Foundation verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install verification tools and package
        run: |
          python -m pip install '.[verification]'
      - name: Check formatting and static issues
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Verify contracts and lifecycle with coverage
        run: |
          coverage run --source=powergrid_bench -m unittest discover -s tests
          coverage report --fail-under=80
          powergrid-bench config-check configs/experiment.template.json
      - name: Build distribution and run installed fixture
        run: |
          python -m build
          powergrid-bench fixture-run --work-dir work/acceptance --trusted-local
      - name: Retain synthetic acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: fixture-python-${{ matrix.python }}
          path: work/acceptance/report.json

  rte-task-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned RTE verification dependencies
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 ijson==3.4.0.post0
      - name: Verify portable RTE task with synthetic official-schema cases
        run: |
          python -m unittest discover -s task-packages/rte-maintenance-abc-x15-v1/verification -v
      - name: Build the real Linux RTE sandbox launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
          cc task-packages/rte-maintenance-abc-x15-v1/images/exec_candidate.c -lseccomp -o /tmp/rte-exec-probe
      - name: Verify real Linux UID, directory, and syscall restrictions
        run: |
          sudo "$(command -v python)" task-packages/rte-maintenance-abc-x15-v1/verification/probe_linux_sandbox.py --launcher /tmp/rte-exec-probe

  uc-speed-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify UC scoring and real local subprocess fixtures
        run: |
          python -m pip install ruff==0.17.0
          ruff check task-packages/pglib-uc-speed-canary-v1
          ruff format --check task-packages/pglib-uc-speed-canary-v1
          python -m unittest discover -s task-packages/pglib-uc-speed-canary-v1/verification -v
      - name: Build the UC launcher and check Linux restrictions
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev
          cc -Wall -Wextra -Werror task-packages/pglib-uc-speed-canary-v1/images/exec_candidate.c -lseccomp -o /tmp/uc-exec
          sudo install /tmp/uc-exec /usr/local/bin/uc-exec
          sudo "$(command -v python)" task-packages/pglib-uc-speed-canary-v1/verification/probe_linux_sandbox.py
